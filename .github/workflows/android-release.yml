name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          ls -la app/build/outputs/apk/release/
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            SIGNING="release-signed"
          else
            SIGNING="debug-signed"
          fi
          mkdir -p out
          cp "$APK" "out/JNet-System-Monitor-v${VERSION}-${SIGNING}.apk"
          echo "PUBLISHED_APK=out/JNet-System-Monitor-v${VERSION}-${SIGNING}.apk" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            SIGNING="signed with the project release keystore"
          else
            SIGNING="debug-signed (no release keystore configured)"
          fi
          {
            echo "J~Net System Monitor v${VERSION}"
            echo ""
            echo "- Built automatically by GitHub Actions on ubuntu-latest."
            echo "- APK signing: ${SIGNING}."
            echo "- Created By J~Net 2026"
            echo "- Website: https://jnetai.com"
            echo ""
            echo "Install the APK on an Android 8.0 (API 26) or newer device."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNet-System-Monitor-Release-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
